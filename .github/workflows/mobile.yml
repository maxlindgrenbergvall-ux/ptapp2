# Bygger Coavira som native app (Capacitor) – Android och iOS – på GitHubs
# maskiner, så att ingen lokal Mac eller Android Studio behövs.
#
# Resultat (under "Artifacts" på körningen):
#  - coavira-android-debug: app-debug.apk, kan installeras direkt på en Android-telefon.
#  - coavira-ios-simulator: App.app för iOS-simulatorn (osignerad). Riktiga
#    iPhones kräver signering via Apple-utvecklarkontot (senare steg, TestFlight).
#
# Webbadressen appen laddar: repo-variabeln CAPACITOR_SERVER_URL
# (Settings → Secrets and variables → Actions → Variables), eller värdet man
# anger när arbetsflödet körs manuellt.
name: Mobilappar

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "ios/**"
      - "mobile/**"
      - "capacitor.config.ts"
      - "scripts/mobile-*.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "android/**"
      - "ios/**"
      - "mobile/**"
      - "capacitor.config.ts"
      - "scripts/mobile-*.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      server_url:
        description: "Webbadress som appen laddar (tomt = repo-variabeln CAPACITOR_SERVER_URL)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  CAPACITOR_SERVER_URL: ${{ inputs.server_url || vars.CAPACITOR_SERVER_URL || 'https://ptapp2.vercel.app' }}

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Synka Capacitor (Android)
        run: npm run cap:sync -- android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Bygg APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: coavira-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  ios:
    name: iOS (simulator)
    # Intel-Mac: GitHubs arm64-Macar har ofta lång kö ("not acquired by Runner").
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Synka Capacitor (iOS)
        run: npm run cap:sync -- ios
      - name: Bygg för iOS-simulatorn (osignerat)
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Packa App.app
        run: |
          cd ios/build/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent App.app "$GITHUB_WORKSPACE/coavira-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: coavira-ios-simulator
          path: coavira-ios-simulator.zip
          retention-days: 14
          if-no-files-found: error
