# Bygger, signerar och laddar upp iPhone-appen till TestFlight – ingen Mac behövs.
#
# Körs manuellt: Actions → "iOS → TestFlight" → Run workflow.
# Signeringen sköts av Xcode (automatisk signering) med App Store Connect
# API-nyckeln. Repo-hemligheter (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      – Key ID
#   ASC_ISSUER_ID   – Issuer ID
#   ASC_KEY_P8      – hela innehållet i AuthKey_XXXX.p8
# Nyckeln behöver rollen Admin (eller App Manager med tillgång till
# certifikat), annars kan Xcode inte skapa distributionscertifikatet.
#
# Byggnumret är körningens nummer, så varje uppladdning blir unik.
name: iOS → TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer som visas i App Store (t.ex. 1.0)"
        required: false
        default: "1.0"
        type: string

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  TEAM_ID: 4MK2V6C8XZ
  CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL || vars.APP_URL || 'https://ptapp2.vercel.app' }}

jobs:
  testflight:
    name: Bygg och ladda upp
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Kontrollera hemligheterna
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Saknade hemligheter:$missing"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      # Apple kräver en aktuell SDK för nya uppladdningar: använd den nyaste
      # (icke-beta) Xcode som finns på maskinen.
      - name: Välj nyaste Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Synka Capacitor (iOS)
        run: npm run cap:sync -- ios

      - name: Arkivera (Release, signerat)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -version
          # Signeras direkt för App Store (Apple Distribution) – ett utvecklarcertifikat
          # skulle kräva en registrerad iPhone, och sådana finns inte på byggmaskinen.
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            MARKETING_VERSION="${{ inputs.version || '1.0' }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log" || {
              # Felraderna som anteckningar på körningen (syns utan att öppna loggen).
              grep -E "error:|error :|No profiles|provisioning profile|Signing|certificate|Cloud signing|not permitted|requires a development team" "$RUNNER_TEMP/archive.log" \
                | sed 's/^[[:space:]]*//' | sort -u | head -25 | while IFS= read -r line; do echo "::error title=Arkivera::$line"; done
              exit 1
            }

      - name: Exportera och ladda upp till App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log" || {
              grep -E "error|Error|ITMS-|failed|not permitted" "$RUNNER_TEMP/export.log" \
                | sed 's/^[[:space:]]*//' | sort -u | head -25 | while IFS= read -r line; do echo "::error title=Ladda upp::$line"; done
              exit 1
            }
          echo "Uppladdad: version ${{ inputs.version || '1.0' }} (${{ github.run_number }}). Bygget syns i TestFlight efter Apples behandling (oftast 10–30 min)."

      - name: Städa nyckeln
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
